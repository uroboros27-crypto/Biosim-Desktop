name: Build Windows

# Compila BioSim para Windows x64 en los runners de GitHub.
#  - Manualmente: pestaña Actions -> "Build Windows" -> Run workflow.
#  - Automaticamente: al empujar una etiqueta v* (p.ej. v6.8.0), ademas
#    publica un Release con los .exe adjuntos.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build portable + installer (x64)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BioSim-windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
