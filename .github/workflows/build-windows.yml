name: Build Windows

# Compila BioSim para Windows x64 en los runners de GitHub.
#
#  - Etiqueta v* (p.ej. v7.2.1) -> Release definitivo con los .exe adjuntos.
#  - Ejecucion manual (Actions -> Run workflow) -> Release de PRUEBA con la
#    etiqueta fija "dev-build", que se sobrescribe en cada corrida.
#
# NOTA sobre almacenamiento: NO se usa actions/upload-artifact. Los artifacts
# consumen la cuota de 500 MB del plan gratuito y cada corrida genera ~200 MB
# entre el portable y el instalador, asi que se llenaba en dos o tres builds.
# Los binarios adjuntos a un Release NO consumen esa cuota.
#
# NOTA sobre la publicacion: electron-builder corre con --publish never (ver
# package.json). Publica un solo paso, el de softprops/action-gh-release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Comprobacion previa: si el HTML no esta en el repo, el .exe saldria
      # vacio o con una version vieja. Mejor fallar aqui, con un mensaje claro.
      - name: Verificar recursos de la aplicacion
        shell: pwsh
        run: |
          if (-not (Test-Path 'BioSim.html')) {
            Write-Error 'Falta BioSim.html en la raiz del repositorio.'
            exit 1
          }
          $html = Get-Item 'BioSim.html'
          Write-Host ("HTML: {0} ({1:N0} bytes)" -f $html.Name, $html.Length)

          # v8.0: el HTML debe ser 100% autocontenido. Cualquier src/href que no
          # sea data: rompe el funcionamiento sin conexion.
          $txt = Get-Content 'BioSim.html' -Raw
          $ext = [regex]::Matches($txt, '(?:src|href)\s*=\s*["''](?!data:|#|\$\{)[^"'']+["'']')
          if ($ext.Count -gt 0) {
            Write-Host 'Referencias externas encontradas:'
            $ext | ForEach-Object { Write-Host ("  " + $_.Value) }
            Write-Error 'BioSim.html referencia recursos externos: dejaria de funcionar sin conexion.'
            exit 1
          }
          Write-Host 'HTML autocontenido: sin recursos externos.'

          if (-not (Test-Path 'build/icon.ico')) {
            Write-Error 'Falta build/icon.ico (icono de la aplicacion).'
            exit 1
          }
          Write-Host ("Icono: {0:N0} bytes" -f (Get-Item 'build/icon.ico').Length)


      - name: Install dependencies
        run: npm install

      - name: Build portable + installer (x64)
        run: npm run dist

      # Comprobacion posterior: confirmar que el HTML viajo dentro del paquete.
      - name: Verificar contenido del paquete
        shell: pwsh
        run: |
          $listado = npx --yes @electron/asar list dist/win-unpacked/resources/app.asar
          $encontrado = @($listado | Where-Object { $_ -match 'BioSim.*\.html$' })
          if ($encontrado.Count -eq 0) {
            Write-Host 'Contenido de app.asar:'
            $listado | ForEach-Object { Write-Host "  $_" }
            Write-Error 'El HTML no quedo dentro de app.asar. Revisa build.files en package.json.'
            exit 1
          }
          Write-Host 'HTML empaquetado correctamente:'
          $encontrado | ForEach-Object { Write-Host "  $_" }

          # El icono de la VENTANA se lee en tiempo de ejecucion desde
          # resources/icon.ico (extraResources). Sin el, la barra de tareas
          # muestra el icono generico de Electron.
          if (-not (Test-Path 'dist/win-unpacked/resources/icon.ico')) {
            Write-Error 'Falta resources/icon.ico en el paquete. Revisa build.extraResources en package.json.'
            exit 1
          }
          Write-Host 'Icono de ventana empaquetado: resources/icon.ico'

      - name: Listar binarios generados
        shell: pwsh
        run: Get-ChildItem dist/*.exe | ForEach-Object { Write-Host ("{0}  ({1:N0} bytes)" -f $_.Name, $_.Length) }

      # ── Release definitivo (solo al empujar una etiqueta v*) ──────────
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true

      # ── Release de prueba (ejecucion manual) ──────────────────────────
      # Reutiliza siempre la misma etiqueta "dev-build": cada corrida
      # sustituye los .exe anteriores, asi que no se acumula nada.
      - name: Publicar build de prueba
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          tag_name: dev-build
          name: 'BioSim — build de prueba'
          body: |
            Compilacion de prueba generada manualmente.
            Commit: ${{ github.sha }}
            Corrida: #${{ github.run_number }}

            Se sobrescribe en cada ejecucion manual. Para una version
            estable, usa los Releases etiquetados con v*.
          prerelease: true
