name: Build Windows

# Compila BioSim para Windows x64 en los runners de GitHub.
#  - Manualmente: pestaña Actions -> "Build Windows" -> Run workflow.
#  - Automaticamente: al empujar una etiqueta v* (p.ej. v7.2.0), ademas
#    publica un Release con los .exe adjuntos.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Permiso explicito para que el paso de Release pueda publicar
# (buena practica; antes dependia del permiso por defecto del repo).
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7        # node24 nativo [^23^]

      - name: Setup Node.js
        uses: actions/setup-node@v7      # node24 nativo
        with:
          # Este es el Node del TOOLCHAIN de compilacion (npm/electron-builder),
          # NO el runtime de las acciones. Node 20 quedo EOL en abril 2026;
          # 22 es LTS hasta abril 2027 y electron-builder es compatible.
          # Si prefieres cambio minimo, puedes dejar '20' y seguira instalando.
          node-version: '22'
          package-manager-cache: false   # evita la cache automatica nueva de v5+

      - name: Install dependencies
        run: npm install

      - name: Build portable + installer (x64)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7  # node24 desde v6 [^22^]
        with:
          name: BioSim-windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3   # node24; v2 ya no tiene soporte [^40^]
        with:
          files: dist/*.exe
          generate_release_notes: true
